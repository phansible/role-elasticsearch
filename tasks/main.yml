---
- name: Install repository prerequisites
  become: yes
  apt:
    pkg: ca-certificates
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  become: yes
  file: path=/etc/apt/keyrings state=directory mode=0755

- name: Add Elasticsearch repository key
  become: yes
  get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/keyrings/elasticsearch.asc
    mode: '0644'
    force: no

- name: Add Elasticsearch repository
  become: yes
  deb822_repository:
    name: elasticsearch
    uris: "https://artifacts.elastic.co/packages/{{ elasticsearch_version }}.x/apt"
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/elasticsearch.asc
    install_python_debian: yes
  register: elasticsearch_repo

- name: Update packages database for the Elasticsearch repository
  become: yes
  apt: update_cache=yes
  when: elasticsearch_repo is changed

- name: Install Elasticsearch
  become: yes
  apt: pkg=elasticsearch state=present

- name: Set port
  become: yes
  lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '^#?http\.port:'
    line: "http.port: {{ elasticsearch_port }}"
  notify: restart elasticsearch

- name: Toggle Elasticsearch security
  become: yes
  lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '^#?xpack\.security\.enabled:'
    line: "xpack.security.enabled: {{ elasticsearch_security_enabled | bool | lower }}"
  notify: restart elasticsearch

# the package's security auto-configuration writes these as nested blocks, so lineinfile cannot target them
- name: Toggle enrollment and TLS from the security auto-configuration
  become: yes
  replace:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '{{ item }} (true|false)$'
    replace: '\1 {{ elasticsearch_security_enabled | bool | lower }}'
  loop:
    - '^(xpack\.security\.enrollment\.enabled:)'
    - '^(xpack\.security\.http\.ssl:\n  enabled:)'
    - '^(xpack\.security\.transport\.ssl:\n  enabled:)'
  notify: restart elasticsearch

- name: Set heap size
  become: yes
  copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms{{ elasticsearch_heap_size }}
      -Xmx{{ elasticsearch_heap_size }}
    mode: '0644'
  when: elasticsearch_heap_size | length > 0
  notify: restart elasticsearch

- name: Ensure Elasticsearch is started and enabled
  become: yes
  service: name=elasticsearch state=started enabled=yes
