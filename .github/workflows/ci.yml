name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    name: ${{ matrix.image }}
    env:
      ANSIBLE_ROLES_PATH: ..
      ANSIBLE_FORCE_COLOR: '1'
      PLAYBOOK: ansible-playbook -i test, -c community.docker.docker tests/test.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # newest 3.x breaks ansible-core

      - name: Install Ansible
        run: pip install ansible

      # official image plus only what Ansible and services need: python3 and systemd as PID 1
      - name: Start test container
        run: |
          docker build -t test-image - <<EOF
          FROM ${{ matrix.image }}
          RUN apt-get update && apt-get install -y --no-install-recommends python3 systemd systemd-sysv && rm -rf /var/lib/apt/lists/*
          CMD ["/lib/systemd/systemd"]
          EOF
          docker run -d --name test --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw test-image

      - name: Check the role/playbook's syntax
        run: $PLAYBOOK --syntax-check

      - name: Run the role/playbook
        run: $PLAYBOOK

      - name: Run the role/playbook again, checking to make sure it's idempotent
        run: $PLAYBOOK | tee /dev/stderr | grep -q 'changed=0.*failed=0'

      - name: Check Elasticsearch is running
        run: docker exec test systemctl is-active elasticsearch

      - name: Check the installed Elasticsearch version
        run: docker exec test dpkg-query -W -f '${Version}' elasticsearch | grep -q '^9\.'

      # security is on by default, so an unauthenticated request getting 401 proves it is serving
      - name: Check Elasticsearch answers on its port
        run: |
          docker exec test python3 -c "
          import ssl, urllib.request, urllib.error
          try:
              urllib.request.urlopen('https://127.0.0.1:9200', context=ssl._create_unverified_context())
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          else:
              raise SystemExit('expected 401 from a secured node')
          "
